# APIO project configuration file.
# For details see https://fpgawars.github.io/apio/docs/project-file
#
# The OCaml 4.14 bytecode VM (two-port memories, sequential divider) on the
# VC707, running the program in program.hex; output on the USB UART.
# Run ./gen.sh [program.ml] first (default ../../fact.ml): it makes vm_sv2v.v,
# program.hex, heap.hex, globals.hex and program.vh.

[env:default]
board = vc707
top-module = vc707_vm_top

yosys-extra-options = -flatten -abc9

# The nextpnr CI flow's options.
nextpnr-extra-options =
    --router router2
    -o hold-fix
    --placer-heap-timingweight 100
